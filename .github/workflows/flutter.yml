name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Klutch gateway
        run: node --test gateway/server.test.mjs
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
